<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>小豆丁学堂</title>
<style>
  :root{
    --green:#2fa06d; --green-d:#248057; --green-l:#e7f5ee;
    --bg:#eef4ec; --card:#fffdf7; --ink:#22331f; --ink2:#66766a;
    --gold:#f3b53f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;width:100%;max-width:100vw;overflow-x:hidden;}
  body{
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    background:#dfe9df; color:var(--ink);
    display:block; overflow:hidden;
  }
  #app{
    width:100%; max-width:620px; height:100%; margin:0 auto; min-width:0;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }
  header{
    flex:0 0 auto; background:var(--green); color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 0.9rem; height:3.4rem;
  }
  .brand{font-size:1.15rem; font-weight:700; letter-spacing:.5px;}
  .hright{display:flex; align-items:center; gap:.55rem;}
  .stars{background:rgba(255,255,255,.18); border-radius:999px; padding:.22rem .6rem;
    font-size:.92rem; font-weight:700; display:flex; align-items:center; gap:.25rem;}
  .stars b{color:#ffe07a;}
  .gear{
    width:2.1rem;height:2.1rem;border-radius:50%;border:none;
    background:rgba(255,255,255,.18); color:#fff; font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .gear:active{transform:scale(.94);}
  main{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:.7rem .8rem; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column;}
  main > .qwrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .cathead{display:flex;align-items:baseline;gap:.5rem;margin:.2rem .2rem .7rem;}
  .cathead h2{font-size:1.15rem;margin:0;font-weight:800;}
  .cathead span{font-size:.78rem;color:var(--ink2);}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;}
  .catcard{
    background:var(--card); border-radius:1rem; padding:.85rem .8rem .8rem;
    box-shadow:0 .15rem .5rem rgba(40,80,50,.08);
    display:flex; flex-direction:column; gap:.45rem; cursor:pointer;
    border:2px solid transparent; transition:transform .1s;
  }
  .catcard:active{transform:scale(.97);}
  .catcard .cn{font-size:1.02rem;font-weight:800;}
  .catcard .cd{font-size:.72rem;color:var(--ink2);line-height:1.35;min-height:1.9em;}
  .bar{height:.32rem;border-radius:999px;background:#e6ece5;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s;}
  .catcard .pct{font-size:.68rem;color:var(--ink2);display:flex;justify-content:space-between;}
  .resume{
    display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    background:#fff7e0;border:1px solid #f0dcae;border-radius:.8rem;
    padding:.55rem .75rem;margin-bottom:.7rem;font-size:.8rem;color:#8a6414;
  }
  .resume button{border:none;background:var(--gold);color:#fff;font-weight:700;
    padding:.35rem .7rem;border-radius:.6rem;font-size:.78rem;}
  .qtop{display:flex;align-items:center;gap:.5rem;margin:0 .1rem .5rem;}
  .back{border:none;background:var(--green-l);color:var(--green-d);font-weight:700;
    padding:.45rem .8rem;border-radius:.6rem;font-size:.95rem;cursor:pointer;}
  .qtop .where{font-size:.95rem;color:var(--ink2);font-weight:600;}
  .qcard{
    background:var(--card);border-radius:1.1rem;
    box-shadow:0 .18rem .6rem rgba(40,80,50,.09);
    padding:1rem; display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    min-height:min(34vh,15rem); flex:1 1 auto; text-align:center; position:relative;
  }
  .qsub{font-size:1.3rem;color:var(--ink2);margin:.2rem 0 1.2rem;font-weight:700;}
  .qcard .stem{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
  .stem{ font-weight:800;line-height:1.25;letter-spacing:.04em; word-break:break-word; }
  .stem.big{font-size:clamp(2.6rem,13vmin,6rem);}
  .stem.mid{font-size:clamp(2rem,9vmin,4rem);}
  .stem.small{font-size:clamp(1rem,3.6vmin,1.35rem);line-height:1.6;}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;margin-top:.75rem;}
  .opts.one{grid-template-columns:minmax(0,1fr);}
  .opts.two{grid-template-columns:repeat(2,minmax(0,1fr));}
  .opt{
    background:#fff;border-radius:.95rem;border:2px solid #eef1ea;
    box-shadow:0 .14rem .4rem rgba(40,80,50,.07);
    min-height:clamp(3.6rem,9.5vh,6rem);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.7rem,7.5vmin,3.2rem);font-weight:800;color:var(--ink);
    cursor:pointer;transition:transform .08s,background .15s,border-color .15s;
    padding:.3rem;
  }
  .opt:active{transform:scale(.97);}
  .opt.ok{background:#d9f2e3;border-color:var(--green);color:var(--green-d);}
  .opt.no{background:#fde2e0;border-color:#e26a5f;color:#b8382c;}
  .opt.dim{opacity:.42;}
  .opt.len5{font-size:clamp(1.3rem,5vmin,2rem);}
  .opt.len7{font-size:clamp(1.1rem,4vmin,1.5rem);line-height:1.4;}
  .opt.shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .prog{display:flex;gap:.34rem;justify-content:center;margin-top:.7rem;flex-wrap:wrap;}
  .prog i{width:.62rem;height:.62rem;border-radius:50%;background:#cfdacd;}
  .prog i.on{background:var(--green);}
  .prog i.bad{background:#e26a5f;}
  footer{
    flex:0 0 auto; background:#fff; border-top:1px solid #e3ebe3;
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
    padding:.3rem 0 calc(.3rem + env(safe-area-inset-bottom));
  }
  .tab{
    border:none;background:transparent;display:flex;flex-direction:column;
    align-items:center;gap:.1rem;padding:.35rem 0;cursor:pointer;color:#8a9a88;
    font-size:.76rem;font-weight:600;
  }
  .tab .ic{
    width:1.85rem;height:1.85rem;border-radius:.55rem;background:#eef2ec;
    display:flex;align-items:center;justify-content:center;font-size:1rem;color:#7b8b79;
  }
  .tab.on{color:var(--green-d);}
  .tab.on .ic{background:var(--green-l);color:var(--green);}
  .sheet{
    position:absolute;inset:0;background:rgba(20,40,25,.35);
    display:none;align-items:flex-end;z-index:30;
  }
  .sheet.on{display:flex;}
  .sheetbody{
    width:100%;background:#fff;border-radius:1.2rem 1.2rem 0 0;
    padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    max-height:88%;overflow-y:auto;animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(30%);opacity:.6}to{transform:none;opacity:1}}
  .sheetbody h3{margin:.1rem 0 .5rem;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;}
  .sheetbody h3 button{border:none;background:#f2f4f1;border-radius:.5rem;padding:.3rem .6rem;font-size:.78rem;color:var(--ink2);}
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    padding:.5rem .2rem;border-bottom:1px solid #f1f4ef;font-size:.86rem;
  }
  .row small{display:block;color:var(--ink2);font-size:.72rem;margin-top:.15rem;font-weight:400;}
  .sw{width:2.9rem;height:1.6rem;border-radius:999px;background:#d8e0d6;position:relative;transition:background .18s;flex:0 0 auto;}
  .sw::after{content:'';position:absolute;top:.16rem;left:.16rem;width:1.28rem;height:1.28rem;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .sw.on{background:var(--green);}
  .sw.on::after{left:1.46rem;}
  .rowbtn{border:none;background:var(--green-l);color:var(--green-d);font-weight:700;font-size:.8rem;padding:.45rem .8rem;border-radius:.6rem;flex:0 0 auto;}
  .rowbtn.gray{background:#f2f4f1;color:var(--ink2);}
  .statbox{background:#f6f9f4;border-radius:.8rem;padding:.55rem .7rem;font-size:.78rem;line-height:1.6;color:var(--ink2);margin:.5rem 0 0;}
  .statbox b{color:var(--ink);}
  .modal{position:absolute;inset:0;background:rgba(20,40,25,.4);display:none;align-items:center;justify-content:center;z-index:40;padding:1.2rem;}
  .modal.on{display:flex;}
  .mbox{background:#fff;border-radius:1.1rem;padding:1.3rem 1.1rem;width:100%;max-width:20rem;text-align:center;}
  .mbox h4{margin:0 0 .3rem;font-size:1.1rem;}
  .mbox .big{font-size:2rem;font-weight:800;color:var(--green);margin:.3rem 0;}
  .mbox p{margin:.2rem 0;color:var(--ink2);font-size:.84rem;}
  .mbox .btns{display:flex;gap:.6rem;margin-top:1rem;}
  .mbox button{flex:1;border:none;border-radius:.75rem;padding:.7rem;font-weight:700;font-size:.88rem;}
  .btn-p{background:var(--green);color:#fff;}
  .btn-s{background:#f1f4ef;color:var(--ink2);}
  .toast{
    position:absolute;left:50%;bottom:5rem;transform:translateX(-50%) translateY(10px);
    background:rgba(30,50,35,.88);color:#fff;padding:.5rem .9rem;border-radius:999px;
    font-size:.8rem;opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

</div>

var Quiz=(function(){function rand(n){return Math.floor(Math.random()*n);}function shuffle(a,r){r=r||Math.random;a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}function numOpts(ans,n,max){var set=[ans];var guard=0;while(set.length<n&&guard++<200){var v=ans+(rand(9)-4);if(v>=0&&v<=max&&set.indexOf(v)<0)set.push(v);}return shuffle(set).map(String);}function mk(stem,sub,opts,ans,mod){return{stem:stem,sub:sub,opts:opts,ans:String(ans),mod:mod||'mid'};}var CN=['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];var MATH={count:function(i){if(i%2===0){var n=3+rand(8);var dots='';for(var k=0;k<n;k++)dots+='●';return mk(dots,'数一数，一共有几个？',numOpts(n,4,12),n,'mid');}var m=1+rand(20);return mk(CN[m],'这是数字几？',numOpts(m,4,20),m,'mid');},big:function(){function pick(){return rand(10)<7?1+rand(10):11+rand(20);}var a=pick(),b=pick();while(a===b)b=pick();var bigger=rand(2)===0;return mk(a+' 和 '+b,bigger?'哪个数更大？':'哪个数更小？',[String(a),String(b)],bigger?Math.max(a,b):Math.min(a,b),'mid');},add10:function(){var a=1+rand(8),b=1+rand(9);while(a+b>10)b=1+rand(9);return mk(a+' + '+b,'等于几？',numOpts(a+b,4,12),a+b,'big');},sub10:function(){var a=3+rand(8),b=1+rand(a-1);return mk(a+' − '+b,'等于几？',numOpts(a-b,4,10),a-b,'big');},add20:function(i){if(i%2===0){var a=5+rand(12),b=2+rand(8);return mk(a+' + '+b,'等于几？',numOpts(a+b,4,25),a+b,'big');}var c=8+rand(13),d=1+rand(c-2);return mk(c+' − '+d,'等于几？',numOpts(c-d,4,20),c-d,'big');},chain:function(i){var a,b,c;if(i%2===0){a=2+rand(5);b=1+rand(4);c=1+rand(4);return mk(a+' + '+b+' + '+c,'等于几？',numOpts(a+b+c,4,20),a+b+c,'big');}a=6+rand(9);b=1+rand(a-3);c=1+rand(b+3);while(a-b+c<0)c=rand(3);return mk(a+' − '+b+' + '+c,'等于几？',numOpts(a-b+c,4,20),a-b+c,'big');}};function buildRound(data,cat,n){n=n||10;if(MATH[cat]){var out=[],seen={},guard=0;while(out.length<n&&guard++<500){var q=MATH[cat](out.length);var key=q.stem+'|'+q.ans;if(seen[key])continue;seen[key]=1;q.opts=shuffle(q.opts);out.push(q);}return out;}var pool=data.q[cat]||[];if(!pool.length)return[];var round=[];while(round.length<n){var batch=shuffle(pool);for(var i=0;i<batch.length&&round.length<n;i++){var item=batch[i];round.push({stem:item.stem,sub:item.sub,opts:shuffle(item.opts),ans:item.ans,mod:item.mod});}}return round;}return{buildRound:buildRound,shuffle:shuffle,MATH:MATH,CN:CN};})();

ave();drawCats();}});function showFeedback(q){var card=document.querySelector('.qcard');if(!card)return;var stemEl=card.querySelector('.stem');if(!stemEl)return;if(S.cat==='jx'){stemEl.innerHTML=String(q.stem).replace('（　）','（'+q.ans+'）');}else if(S.cat==='zi'){var d=document.createElement('div');d.style.cssText='margin-top:.8rem;font-size:clamp(2.4rem,11vmin,4.5rem);font-weight:800;color:var(--green-d);';d.textContent=q.ans;card.appendChild(d);}else if(S.cat==='zt'){var dz=document.createElement('div');dz.style.cssText='margin-top:.8rem;font-size:clamp(2rem,9vmin,3.5rem);font-weight:800;color:var(--green-d);';dz.textContent=q.ans;card.appendChild(dz);}else if(S.cat==='big'){var parts=String(q.stem).split(' 和 ');var a=parseInt(parts[0]),b=parseInt(parts[1]);var sym=a<b?'<':'>';var ds=document.createElement('div');ds.style.cssText='margin-top:1rem;font-size:clamp(2rem,9vmin,3.5rem);font-weight:800;color:var(--green-d);';ds.textContent=a+' '+sym+' '+b;card.appendChild(ds);}else if(['add10','sub10','add20','chain'].indexOf(S.cat)>=0){var dcalc=document.createElement('div');dcalc.style.cssText='margin-top:1rem;font-size:clamp(1.8rem,8vmin,3rem);font-weight:800;color:var(--green-d);';dcalc.textContent=q.stem+' = '+q.ans;card.appendChild(dcalc);}else if(['wuyan','qiyan','mingju'].indexOf(S.cat)>=0){var full=POEMS[q.stem];if(full){var dp=document.createElement('div');dp.style.cssText='margin-top:1rem;font-size:clamp(.95rem,4vmin,1.2rem);color:var(--ink2);line-height:1.8;white-space:pre-line;text-align:left;';dp.textContent=full;card.appendChild(dp);}}else if(S.cat==='pp'){var d2=document.createElement('div');d2.style.cssText='margin-top:.8rem;font-size:clamp(1.3rem,6vmin,2rem);font-weight:700;color:var(--green-d);';d2.textContent='偏旁：'+q.ans;card.appendChild(d2);}}function drawQuiz(){var q=S.round[S.i];if(!q){finishRound();return;}var cm=catMeta(S.tab,S.cat);var dots='';for(var k=0;k<S.round.length;k++){var cls='';if(k<S.i)cls=S.round[k]._ok?' on':' bad';else if(k===S.i)cl gth;var acc=total?Math.round(S.right/total*100):0;var got=S.right;S.stars+=got;S.saved=null;drawStars();save();var cm=catMeta(S.tab,S.cat);var mbox=$('mbox');mbox.innerHTML='<h4>'+cm.n+' 完成</h4><div class="big">+'+got+' ★</div><p>答对 '+S.right+' / '+total+' 题，正确率 '+acc+'%</p><p>'+(acc>=90?'太棒了，全都难不倒你！':acc>=60?'不错，再练一轮更稳。':'慢慢来，多练几次就熟了。')+'</p><div class="btns"><button class="btn-s" id="mBack">返回分类</button><button class="btn-p" id="mAgain">再来一轮</button></div>';$('modal').classList.add('on');$('mBack').onclick=function(){$('modal').classList.remove('on');backOut();};$('mAgain').onclick=function(){$('modal').classList.remove('on');startCat(S.cat);};}function totals(){var total=0,right=0,misTotal=0;Object.keys(S.stat).forEach(function(k){total+=S.stat[k].a;right+=S.stat[k].r;});Object.keys(S.mis).forEach(function(k){misTotal+=Object.keys(S.mis[k]).length;});return{total:total,right:right,mis:misTotal,acc:total?Math.round(right/total*100):0};}function openSheet(){var t=totals();var rows='';rows+='<div class="row"><div>答对/答错提示音<small>关掉就完全安静</small></div><div class="sw '+(S.sound?'on':'')+'" data-sw="sound"></div></div>';rows+='<div class="row"><div>护眼提醒<small>连续玩 '+EYE_MIN+' 分钟提醒休息</small></div><div class="sw '+(S.eye?'on':'')+'" data-sw="eye"></div></div>';rows+='<div class="row"><div>错题重练<small>把做错的题再抽一轮</small></div><button class="rowbtn '+(t.mis?'':'gray')+'" id="redoBtn">'+(t.mis?(t.mis+' 道'):'暂无')+'</button></div>';rows+='<div class="row"><div>家长看这一页<small>做题量和各类掌握度</small></div><button class="rowbtn" id="statBtn">查看</button></div>';rows+='<div class="row"><div>清空全部进度<small>星星、统计、错题都会没</small></div><button class="rowbtn gray" id="clearBtn">清空</button></div>';$('sheetBody').innerHTML='<h3>设置<button id="closeSheet">关闭</button></h3>'+rows+'<div class="statbox">累计做题 <b>'+t.total+'</b> 道，答对 <b>'+t.right+'</b> 道，正确率 <b>'+t.acc+'%</b><br>星星 <b>'+S.stars+'</b> 颗，错题本 <b>'+t.mis+'</b> 道<br><span style="font-size:.72rem">内容 v'+S.ver+' · '+(S.ver?'已联网更新':'安装包内置')+'</span></div>';$('sheet').classList.add('on');$('closeSheet').onclick=function(){$('sheet').classList.remove('on');};$('sheet').onclick=function(e){if(e.target===$('sheet'))$('sheet').classList.remove('on');};Array.prototype.forEach.call($('sheetBody').querySelectorAll('[data-sw]'),function(el){el.onclick=function(){var k=el.dataset.sw;S[k]=!S[k];el.classList.toggle('on');save();if(k==='sound'&&S.sound)beep(true);if(k==='eye'&&S.eye)eyeStart=Date.now();};});$('redoBtn').onclick=function(){if(!t.mis){toast('还没有错题');return;}var all=[];Object.keys(S.mis).forEach(function(cat){Object.keys(S.mis[cat]).forEach(function(key){var stem=key.split('|')[0];var pool=(DATA.q[cat]||[]).filter(function(q){return q.stem===stem;});if(pool.length){var q=pool[0];all.push({stem:q.stem,sub:q.sub,ans:q.ans,opts:q.opts,mod:q.mod,cat:cat});}});});if(!all.length){toast('错题里只有数学题，去数字页练更合适');return;}all=Quiz.shuffle(all).slice(0,ROUND);S.cat=all[0].cat;Object.keys(DATA.cats).forEach(function(tb){if(DATA.cats[tb].some(function(c){return c.k===S.cat;}))S.tab=tb;});S.round=all.map(function(q){return{stem:q.stem,sub:q.sub,opts:Quiz.shuffle(q.opts),ans:q.ans,mod:q.mod};});S.i=0;S.right=0;$('sheet').classList.remove('on');drawTabs();drawQuiz();toast('错题重练开始');};$('statBtn').onclick=function(){var lines=DATA.tabs.map(function(tb){var cs=DATA.cats[tb.key].map(function(c){var st=S.stat[c.k]||{a:0,r:0};return c.n+' '+(st.a?Math.round(st.r/st.a*100)+'%':'—');});return '<div style="margin-top:.5rem"><b>'+tb.name+'</b><br>'+cs.join('　')+'</div>';}).join('');$('sheetBody').innerHTML='<h3>家长页面<button id="backSet">返回</button></h3><div class="statbox">累计做题 <b>'+t.total+'</b> 道，正确率 <b>'+t.acc+'%</b>，星星 <b>'+S.stars+'</b></div><div style="font-size:.82rem;color:#66766a">'+lines+'</div>';$('backSet').onclick=openSheet;};$('clearBtn').onclick=function(){if(!confirm('清空全部进度？星星和统计都会重置。'))return;S.stars=0;S.stat={};S.mis={};S.saved=null;save();drawStars();toast('已清空');$('sheet').classList.remove('on');};}var eyeStart=Date.now();
